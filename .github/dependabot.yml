version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # libc 0.2.190 removed the Linux `ENOATTR` alias that xattr 0.2.3 (via
      # gpui 0.2.2 -> gpui_http_client -> zed-async-tar) still uses. Remove
      # this once gpui no longer pulls in xattr 0.2.
      - dependency-name: libc
        versions: [">= 0.2.190"]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # dtolnay/rust-toolchain has no release-version tags. Review its
      # action pin manually; explicit inputs preserve stable and MSRV 1.85.
      - dependency-name: dtolnay/rust-toolchain
