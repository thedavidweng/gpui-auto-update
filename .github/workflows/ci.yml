name: CI

on:
  push:
    branches: [main, "spec-*", "ticket/**"]
  pull_request:
  schedule:
    # Weekly, so new RustSec advisories surface without a code change.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install GPUI system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig1-dev libfreetype-dev
      - name: Ensure Metal toolchain (macOS)
        if: runner.os == 'macOS'
        # GPUI compiles Metal shaders at build time; newer Xcode releases ship
        # the Metal toolchain as a separate download.
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build docs with warnings denied
        # On every OS, so documentation of platform-specific public APIs is
        # checked where those APIs exist.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  sparkle:
    name: Sparkle backend (macOS, real framework)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the pinned Sparkle distribution
        run: cargo run --locked -q -p gpui-auto-update-cli -- sparkle fetch --out "$RUNNER_TEMP/sparkle"
      - name: Clippy and tests with Sparkle linked
        env:
          SPARKLE_FRAMEWORK_PATH: ${{ runner.temp }}/sparkle
          DYLD_FRAMEWORK_PATH: ${{ runner.temp }}/sparkle
        run: |
          cargo clippy --locked -p gpui-auto-update-macos --features sparkle --all-targets -- -D warnings
          cargo test --locked -p gpui-auto-update-macos --features sparkle -- --include-ignored

  linux-e2e:
    name: Linux end-to-end update and rollback
    runs-on: ubuntu-latest
    env:
      # Smaller binaries to package and a faster build; the test job keeps
      # full debug info.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GPUI system dependencies, a virtual display, and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig1-dev libfreetype-dev \
            xvfb xauth mesa-vulkan-drivers libvulkan1 fonts-dejavu-core
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - name: Update 1.0.0 -> 1.1.0, then roll back a broken 1.2.0
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" tools/e2e/linux-update.sh

  msrv:
    name: MSRV (non-GPUI crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo check --locked
          -p gpui-auto-update-core
          -p gpui-auto-update-macos
          -p gpui-auto-update-windows
          -p gpui-auto-update-linux
          -p gpui-auto-update-cli

  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --locked
          command: check ${{ matrix.checks }}
