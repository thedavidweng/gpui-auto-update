name: macOS end-to-end

# Updates the reference app from 1.0.0 to 1.0.1 through the real Sparkle
# framework on a macOS runner, as a signed .app with Sparkle embedded.
#
# `bundle` needs no credentials. It builds both versions, signs them ad hoc,
# checks the bundle structure (`codesign --verify --deep --strict` and
# `gpui-auto-update sparkle validate`), signs an appcast with a disposable
# key, and lets version 1.0.0 update itself from a loopback server, once
# through the generated delta and once through the full archive fallback.
#
# `notarize` runs only when the Developer ID and notary secrets exist (never
# for pull requests from forks). It signs the bundle with the Developer ID
# identity in a temporary keychain, submits it with `notarytool`, and staples
# the ticket. Repository secrets:
#
#   MACOS_CERTIFICATE_P12         base64 of the "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD    the .p12 password
#   MACOS_SIGNING_IDENTITY        e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY_P8_BASE64          base64 of the App Store Connect team API .p8
#   NOTARY_KEY_ID                 App Store Connect key ID
#   NOTARY_ISSUER_ID              App Store Connect team issuer ID

on:
  push:
    branches: [main, "spec-*", "ticket/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      require_notarization:
        description: Require complete Developer ID and API-key credentials
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Debug builds without debug info keep the bundles small and the builds
  # fast; the builds opt in to self-update explicitly.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  bundle:
    name: Update through Sparkle and validate the bundle signing
    runs-on: macos-latest
    timeout-minutes: 60
    needs: credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "stable"
      - name: Ensure Metal toolchain
        # GPUI compiles Metal shaders at build time; newer Xcode releases
        # ship the Metal toolchain as a separate download.
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-e2e
      - name: Update 1.0.0 to 1.0.1 (delta and full archive)
        env:
          E2E_CLEAN_SPARKLE_STATE: "1"
          E2E_WORK_DIR: ${{ runner.temp }}/reference-e2e
        run: tools/e2e/macos-reference-update.sh
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-e2e-logs
          path: |
            ${{ runner.temp }}/reference-e2e/*/app.log
            ${{ runner.temp }}/reference-e2e/*/requests.log
            ${{ runner.temp }}/reference-e2e/report.log
            ${{ runner.temp }}/reference-e2e/server.log
          if-no-files-found: ignore

  credentials:
    name: Validate signing inputs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      present: ${{ steps.check.outputs.present }}
    env:
      # `secrets` cannot be used in a job-level `if`, so this job exposes
      # whether they exist as an output that `notarize` can test.
      SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      REQUIRE_NOTARIZATION: ${{ inputs.require_notarization == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test signing input and API-key gates
        run: python3 .github/scripts/test-notarization.py
      - id: check
        run: bash .github/scripts/check-signing-inputs.sh

  notarize:
    name: Developer ID signing and notarization
    runs-on: macos-latest
    timeout-minutes: 90
    needs: [bundle, credentials]
    if: needs.credentials.outputs.present == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "stable"
      - name: Ensure Metal toolchain
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-e2e
      - name: Import the certificate into a temporary keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          password="$(uuidgen)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Package and sign with the Developer ID identity
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          work="$RUNNER_TEMP/notarize"
          mkdir -p "$work"
          cargo build --locked -q -p gpui-auto-update-cli
          cli="$PWD/target/debug/gpui-auto-update"
          "$cli" sparkle fetch --out "$work/sparkle"
          "$cli" keys generate --output "$work/ed25519.key" > /dev/null
          SPARKLE_FRAMEWORK_PATH="$work/sparkle" REFERENCE_APP_VERSION=1.0.0 \
            cargo build --locked -q -p gpui-auto-update-reference-app --features sparkle --release
          tools/e2e/package-reference-app.sh --cli "$cli" --sparkle "$work/sparkle" \
            --binary target/release/reference-app --app "$work/Reference App.app" \
            --version 1.0.0 --build 100 --bundle-id dev.gpui-auto-update.reference-e2e.notarize \
            --feed https://example.invalid/appcast.xml \
            --public-key "$("$cli" keys public-key --key-file "$work/ed25519.key")" \
            --identity "$MACOS_SIGNING_IDENTITY" --keychain "$KEYCHAIN"
          ditto -c -k --sequesterRsrc --keepParent "$work/Reference App.app" "$work/ReferenceApp.zip"
          echo "WORK=$work" >> "$GITHUB_ENV"
      - name: Notarize and staple using the team API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: bash .github/scripts/notarize-api-key.sh
      - name: Preserve the verified stapled reference application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: developer-id-notarized-reference-app
          path: |
            ${{ env.WORK }}/ReferenceApp.zip
            ${{ env.WORK }}/notarization.json
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [[ -n "${KEYCHAIN:-}" && -f "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN"
          fi
