name: Package

# Builds the packaged `.crate` files from a new project outside the workspace,
# as a crates.io user would. Release publishing reuses this workflow as a gate.

on:
  push:
    # `main` is covered by release-plz.yml, which calls this workflow.
    branches: ["spec-*", "ticket/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # In a `workflow_call`, `github.workflow` is the caller's name, so release
  # gating runs never share a group with (or get cancelled by) direct runs.
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'Package' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fresh-consumer:
    name: fresh consumer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "stable"
      - name: Install GPUI system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig1-dev libfreetype-dev
      - name: Ensure Metal toolchain (macOS)
        if: runner.os == 'macOS'
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Package crates and build them as a fresh consumer
        shell: bash
        run: tools/release/fresh-consumer.sh
