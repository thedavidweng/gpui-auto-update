name: Sparkle release check

on:
  schedule:
    # Daily, so Sparkle security releases are noticed promptly.
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newer-release:
    name: Notify about newer stable Sparkle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the pin with the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-sparkle-release.sh

  pinned-archive:
    # Re-verifies the pinned checksum against GitHub and packages, signs
    # (ad hoc), validates, and launches an app against the real framework.
    name: Pinned Sparkle end to end (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p gpui-auto-update-cli --locked -- --ignored
