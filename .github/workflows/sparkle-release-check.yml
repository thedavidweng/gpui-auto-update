name: Sparkle release check

on:
  schedule:
    # Daily, so Sparkle security releases are noticed promptly.
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newer-release:
    name: Notify about newer stable Sparkle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Compare the pin with the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-sparkle-release.sh

  pinned-archive:
    # Re-verifies the pinned checksum against GitHub and packages, signs
    # (ad hoc), validates, and launches an app against the real framework.
    name: Pinned Sparkle end to end (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gpui-auto-update-cli --locked -- --ignored
