[workspace]
resolver = "3"
members = [
    "crates/gpui-auto-update-core",
    "crates/gpui-auto-update-macos",
    "crates/gpui-auto-update-windows",
    "crates/gpui-auto-update-linux",
    "crates/gpui-auto-update",
    "crates/gpui-auto-update-ui",
    "crates/gpui-auto-update-cli",
    "apps/reference-app",
    "tools/workspace-policy",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thedavidweng/gpui-auto-update"
homepage = "https://github.com/thedavidweng/gpui-auto-update"
authors = ["gpui-auto-update contributors"]

[workspace.dependencies]
gpui-auto-update-core = { path = "crates/gpui-auto-update-core", version = "0.0.0" }
gpui-auto-update-macos = { path = "crates/gpui-auto-update-macos", version = "0.0.0" }
gpui-auto-update-windows = { path = "crates/gpui-auto-update-windows", version = "0.0.0" }
gpui-auto-update-linux = { path = "crates/gpui-auto-update-linux", version = "0.0.0" }
gpui-auto-update = { path = "crates/gpui-auto-update", version = "0.0.0" }
gpui-auto-update-ui = { path = "crates/gpui-auto-update-ui", version = "0.0.0" }

# Libraries must not choose GPUI platform features; the application does.
gpui = { version = "0.2.2", default-features = false }

serde_json = "1"
serde_yaml = "0.9"

[workspace.lints.rust]
missing_docs = "warn"
# Denied rather than forbidden so platform backend modules can opt in locally
# with `#[allow(unsafe_code)]`; everything else stays safe Rust.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
