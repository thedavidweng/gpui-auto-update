[package]
name = "gpui-auto-update-macos"
description = "macOS backend for gpui-auto-update, delegating update mechanics to Sparkle 2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/gpui-auto-update-macos"
readme = "README.md"
keywords = ["auto-update", "updater", "sparkle", "macos", "desktop"]
categories = ["os::macos-apis", "gui"]

[features]
# Links the real Sparkle 2 framework through `sparkle-updater`. Opt-in because
# its build script panics on macOS unless Sparkle.framework is available
# (SPARKLE_FRAMEWORK_PATH), and every binary that enables it loads the
# framework at launch. See docs/adr/0002-sparkle-binding.md.
sparkle = ["dep:sparkle-updater", "dep:dispatch2"]

[dependencies]
gpui-auto-update-core.workspace = true
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
sparkle-updater = { version = "0.1.0", optional = true }
dispatch2 = { version = "0.3.1", optional = true, default-features = false, features = ["std", "objc2"] }

[[test]]
name = "sparkle_main_thread"
harness = false
required-features = ["sparkle"]

# Bundles itself into a temporary .app and runs a real background check
# against Sparkle.framework; see the test's module documentation.
[[test]]
name = "sparkle_bundle"
harness = false
required-features = ["sparkle"]

# NSApplication for the bundled test's event loop; the Objective-C runtime
# for its class and protocol checks.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[lints]
workspace = true

[package.metadata.docs.rs]
# Platform code is cfg-gated, so document it on the platform it targets.
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# docs.rs sets DOCS_RS, which makes sparkle-updater skip linking the framework.
features = ["sparkle"]
