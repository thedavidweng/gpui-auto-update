[package]
name = "gpui-auto-update-windows"
description = "Windows backend for gpui-auto-update: verified installer and portable update handoff."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/gpui-auto-update-windows"
readme = "README.md"
keywords = ["auto-update", "updater", "windows", "installer", "desktop"]
categories = ["os::windows-apis", "gui"]

[dependencies]
gpui-auto-update-core.workspace = true
thiserror = "2.0.21"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
tempfile = "3.27.0"
tiny_http = "0.12.0"

[lints]
workspace = true

[package.metadata.docs.rs]
# Platform code is cfg-gated, so document it on the platform it targets.
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
