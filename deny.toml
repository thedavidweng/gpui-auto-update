# cargo-deny configuration. Run locally with `cargo deny --locked check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
# Check every desktop target we ship, not just the host.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# Vulnerabilities and yanked crates always fail. Unmaintained notices fail
# only for crates we depend on directly; transitive ones (mostly inside GPUI)
# are reported but cannot be fixed here.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Everything we ship is MIT OR Apache-2.0, so every dependency must be
# compatible with redistribution under both.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    # File-level copyleft only: unmodified MPL dependencies (cbindgen, dwrote,
    # option-ext via GPUI) do not affect the license of our own code.
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Only the GPUI layer may use GPUI directly; the core and platform
    # backends stay framework-independent (ADR 0001).
    { crate = "gpui", wrappers = [
        "gpui-auto-update",
        "gpui-auto-update-ui",
        "gpui-auto-update-reference-app",
    ] },
    # Unofficial GPUI repackaging with a different package identity.
    { crate = "gpui-pre" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
